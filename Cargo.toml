[package]
name = "mcp-doze"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
description = "Start each stdio MCP server on first use, keep its state until disconnect."
license = "MIT"
repository = "https://github.com/mmng-a/mcp-doze"
readme = "README.md"

[dependencies]
anyhow = "1.0"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "io-util", "io-std", "process", "signal", "time", "sync"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
